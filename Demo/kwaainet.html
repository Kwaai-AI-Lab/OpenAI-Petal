<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KwaaiNet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!-- Include marked.js for Markdown rendering -->
    
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 100%;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: row;
            height: 100vh;
        }

        #map-container {
            flex: 2;
            display: flex;
            flex-direction: column;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        /* Adjust the popup size */
        .leaflet-popup-content {
            font-size: 1.5rem; /* Increase the font size */
            line-height: 1.6;
            width: 400px; /* Increase width */
        }

        .leaflet-popup-content-wrapper {
            padding: 20px;
        }

        /* Style for chat container */
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            padding: 20px;
            border-left: 1px solid #ddd;
            box-shadow: -2px 0px 10px rgba(0, 0, 0, 0.1);
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .chat-box .message {
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 1.2rem;
        }

        .chat-box .user {
            background-color: #e0f7fa;
            text-align: right;
        }

        .chat-box .bot {
            background-color: #f0f0f0;
            text-align: left;
        }

        .chat-input {
            display: flex;              /* Make the container a flexbox */
            align-items: center;        /* Vertically align input and button */
            padding-top: 10px;
        }

        .chat-input textarea {
            flex: 1;                    /* Let the input box take up remaining space */
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-right: 10px;
            font-size: 1.2rem;
            height: 40px;               /* Set a fixed height */
            resize: none;               /* Disable resizing */
        }

        .chat-input button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;               /* Match the height with the textarea */
        }

        /* Slow blink effect */
        .blinking {
            animation: blink-animation 2s infinite ease-in-out;  /* Slow blink every 2 seconds */
        }

        @keyframes blink-animation {
            0% { background-color: #f0f0f0; }
            50% { background-color: #e0e0e0; }
            100% { background-color: #f0f0f0; }
        }

        .loading-status {
            display: none;
            color: #333;
            font-weight: bold;
            font-size: 1.2rem;
            padding-top: 10px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div id="map-container">
        <h1>KwaaiNet</h1>
        <div class="refresh-interval">
            <label for="interval-select">Refresh Interval: </label>
            <select id="interval-select">
                <option value="1000">1 second</option>
                <option value="2000">2 seconds</option>
                <option value="5000" selected>5 seconds</option>
                <option value="30000">30 seconds</option>
            </select>
        </div>
        <div id="map"></div>
    </div>

    <!-- Chat Container -->
    <div id="chat-container">
        <div id="chat-box" class="chat-box"></div>
        <div class="chat-input">
            <textarea id="user-input" placeholder="Type your message..." rows="2"></textarea>
            <button id="send-btn">Send</button>
        </div>
        <span class="loading-status" id="loading-status-chat">Processing<span class="spinner"></span></span>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <script>
        // Map and Marker logic
        var map = L.map('map').setView([34.0522, -118.2437], 2); // Default view
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
        }).addTo(map);

        var markers = L.markerClusterGroup();
        var intervalId;

        function fetchAndUpdateMarkers() {
            fetch('http://192.168.7.55:5000/api/v1/state')  // Replace with correct API
                .then(response => response.json())
                .then(data => {
                    markers.clearLayers();
                    const modelReports = data.model_reports;
                    modelReports.forEach(report => {
                        report.server_rows.forEach(server => {
                            const location = server.peer_ip_info.location;
                            const blocks = server.span? server.span.start + "-" + server.span.end: "N/A";
                            let lat = 34.0522;
                            let lon = -118.2437;
                            let locationInfo = "Location Unknown";
                            if (location && location.status === "success") {
                                lat = location.lat;
                                lon = location.lon;
                                locationInfo = `${location.city}, ${location.country}`;
                            }

                            // Color markers based on status
                            let markerColor = server.state === "online" ? 'green' : 'red';
                            let markerIcon = L.icon({
                                iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${markerColor}.png`,
                                iconSize: [25, 41],
                                iconAnchor: [12, 41],
                                popupAnchor: [1, -34],
                                shadowUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-shadow.png',
                                shadowSize: [41, 41]
                            });

                            // Get throughput and determine its color
                            const throughput = server.span.server_info.throughput;
                            let throughputColor = "#FF0000"; // Default to red
                            if (throughput > 500) {
                                throughputColor = "#00FF00"; // Green for high throughput
                            } else if (throughput > 100) {
                                throughputColor = "#FFFF00"; // Yellow for medium throughput
                            }

                            let publicName = server.span.server_info.public_name || "N/A";

                            let marker = L.marker([lat, lon], { icon: markerIcon });
                            marker.bindPopup(`
                                <b>Model:</b> ${report.name}<br>
                                <b>Location:</b> ${locationInfo}<br>
                                <b>Public Name:</b> ${publicName}<br>
                                <b>Blocks:</b> ${blocks}<br>
                                <b>Throughput (tok/sec):</b>                                 
                                <span style="color:${throughputColor}">${throughput.toFixed(2)}</span>                                
                            `);
                            markers.addLayer(marker);
                        });
                    });
                    map.addLayer(markers);
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        function startUpdatingMarkers(interval) {
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(fetchAndUpdateMarkers, interval);
        }

        document.getElementById('interval-select').addEventListener('change', function() {
            var selectedInterval = parseInt(this.value);
            startUpdatingMarkers(selectedInterval);
        });

        fetchAndUpdateMarkers();
        startUpdatingMarkers(5000); // Default interval 5 seconds

        // Chat and Streaming Logic with Markdown and Stopwords

        const stopWords = ['<｜end▁of▁sentence｜>'];  // Stop word list
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const loadingStatus = document.getElementById('loading-status-chat');

        function appendMessage(text, className, messageId = null) {
                let messageElement = document.getElementById(messageId);
                if (!messageElement) {
                    // Create a new message element
                    messageElement = document.createElement('div');
                    if (className=='bot')
                        messageElement.className = `message ${className} blinking`;  // Add blinking class initially
                    else
                        messageElement.className = `message ${className}`;
                    messageElement.id = messageId;  // Set the unique ID for bot messages
                    messageElement.innerHTML = marked.parse(text);  // Use marked.js to render markdown

                    // Append to chat box
                    chatBox.appendChild(messageElement);
                    
                } else {
                    messageElement.innerHTML = marked.parse(text);  // Update the existing message for streaming
                    if (className=='bot')
                        messageElement.classList.remove('blinking');    // Remove blinking when content is updated
                }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function containsStopWord(token) {
            return stopWords.some(word => token.toLowerCase().includes(word));
        }

        async function sendMessageToOpenAI() {
            const message = userInput.value;
            const userMessageId = `user-${Date.now()}`;
            const botMessageId = `bot-${Date.now()}`;
            appendMessage(message, 'user', userMessageId);
            userInput.value = '';
            loadingStatus.style.display = 'inline-block';

            const chatMessages = [
            { 
                role: 'system', 
                content: `You are Lumi, a helpful assistant to an organization called kwaai. Respond to user in a polite and professional manner. Keep your response brief.\n
                context:
                Kwaai is an organization focused on supporting learning and growth in the field of artificial intelligence (AI). They provide opportunities for skill development, community and network building, and exposure to the latest AI technologies and research. Ensuring AI accessibility and fairness is also a priority for Kwaai, as they aim to distribute its benefits equally to promote ethical use.
Some prominent names in Kwaai include Reza Rassool, CEO and Chair; Younes Aatif, Arkus Nexus; Sam Johnston, PaiOS Leader; Brian Ragazzi, KwaaiNet Leader; Khai Pham, MD, PhD (AI), Fundamentals Leader; Ruth Rassool, Education Leader; and Celina Lewis, Operations Leader. 
KwaaiNet refers to the network or infrastructure associated with Kwaai, an open-source, decentralized personal AI operating system. Kwaai aims to provide transparency, control, and accountability in AI-enhanced decision-making processes for users.` 
            },
            { 
                role: 'user', 
                content: `${message}\n` 
            }
            ];


            const requestBody = {
                model: 'meta-llama/Llama-3.1-8B-Instruct',
                messages: chatMessages,
                max_tokens: 256,
                temperature: 0.1,
                stream: true
            };

            let contentBuffer  = '';
            let botResponse = '';
            let inAssistantBlock = false;  // Track if we're inside the assistant block

            try {
                const response = await fetch('http://192.168.7.55:8000/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'YOUR_API_KEY'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                

                while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            const lines = chunk.split('\n');

            for (let line of lines) {
                if (line.startsWith('data: ')) {
                    const jsonData = line.slice(6);  // Remove "data: " prefix
                    if (jsonData === '[DONE]') break;

                    try {
                        const parsedData = JSON.parse(jsonData);
                        if (parsedData.choices && parsedData.choices[0].delta && parsedData.choices[0].delta.content) {
                            // Buffer the delta content
                            contentBuffer += parsedData.choices[0].delta.content;
                            console.log(contentBuffer)
                            inAssistantBlock = true;
                            // Check if we have received the full <|start_header_id|>assistant<|end_header_id|> marker
                            //if (!inAssistantBlock && contentBuffer.includes('</think>')) {
                            //    inAssistantBlock = true;  // Assistant block has started
                            //    contentBuffer = contentBuffer.replace('</think>', '');  // Clean up the marker
                            //}

                            //if (!inAssistantBlock && contentBuffer.includes('assistant<|end_header_id|>')) {
                            //    inAssistantBlock = true;  // Assistant block has started
                            //    contentBuffer = contentBuffer.replace('assistant<|end_header_id|>', '');  // Clean up the marker
                            //}
                            

                            // Only display the content if we are within the assistant block
                            if (inAssistantBlock) {
                                // Check for stop words, including <|eot_id|>
                                if (stopWords.some(stopWord => contentBuffer.toLowerCase().includes(stopWord))) {
                                    console.log('Stop word detected, terminating stream...');
                                    reader.cancel();  // Stop the stream
                                    contentBuffer = contentBuffer.replace('<｜end▁of▁sentence｜>', '');  // Clean up <|eot_id|>
                                    botResponse += contentBuffer;  // Append the remaining part
                                    appendMessage(botResponse, 'bot', botMessageId);  // Finalize the message
                                    break;
                                }

                                // Progressively append to the botResponse and update the UI
                                botResponse += contentBuffer;
                                appendMessage(botResponse, 'bot', botMessageId);  // Update UI

                                // Clear content buffer after processing
                                contentBuffer = '';
                            }
                        }
                    } catch (error) {
                        console.error('Error parsing JSON:', error);
                    }
                }
            }
        }
    } catch (error) {
        appendMessage('Error: ' + error.message, 'bot');
    } finally {
        loadingStatus.style.display = 'none';
    }
}

        sendBtn.addEventListener('click', function() {
            if (userInput.value.trim()) {
                sendMessageToOpenAI();
            }
        });

        userInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                if (userInput.value.trim()) {
                    sendMessageToOpenAI();
                }
            }
        });
    </script>
</body>
</html>
