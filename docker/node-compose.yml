# KwaaiNet Node Service - macOS Optimized
# Runs a distributed inference node that contributes compute to the KwaaiNet network

services:
  kwaainet-node:
    image: kwaailab/kwaainet-node:latest
    container_name: kwaainet-node
    restart: unless-stopped
    
    environment:
      # Node configuration
      - PUBLIC_NAME=${USER:-kwaainet_user}
      - KWAAINET_BLOCKS=2                    # Number of model blocks to serve
      - KWAAINET_DEVICE=auto                 # Auto-detect best device (MPS/CPU)
      
      # macOS Apple Silicon optimizations
      - PYTORCH_ENABLE_MPS_FALLBACK=1        # Enable MPS fallback for Apple Silicon
      - CUDA_VISIBLE_DEVICES=""              # Disable CUDA (not available on macOS)
      
      # Performance tuning
      - OMP_NUM_THREADS=4                    # Optimize CPU thread usage
      - PYTORCH_DISABLE_DISTRIBUTED=1        # Disable distributed training features
    
    volumes:
      # Persistent model cache (important for large models like Llama)
      - ${HOME}/.cache/huggingface:/root/.cache
      
      # Optional: Custom model directory
      # - ${HOME}/kwaainet-models:/models
    
    ports:
      - "8081:8080"                          # Node health/status endpoint
    
    # Use amd64 for broader compatibility
    platform: linux/amd64
    
    # Resource limits (adjust based on your Mac's capabilities)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 4G
    #       cpus: '2.0'
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s