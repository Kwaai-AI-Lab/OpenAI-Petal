version: "3.9"

services:
  caddy:
    image: caddy:2-alpine
    container_name: kwaainet-caddy
    restart: unless-stopped
    
    ports:
      - "80:80"    # HTTP (redirects to HTTPS)
      - "443:443"  # HTTPS
    
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    
    # Connect to docker_default network to access API container
    networks:
      - docker_default
    
    environment:
      - CADDY_ADMIN=:2019
    
    # Inline Caddyfile configuration
    command: |
      sh -c 'echo "
      api.kwaai.ai {
          reverse_proxy kwaainet-api:8000

          header {
              Access-Control-Allow-Origin \"*\"
              Access-Control-Allow-Methods \"GET, POST, PUT, DELETE, OPTIONS\"
              Access-Control-Allow-Headers \"Content-Type, Authorization\"
          }

          @options method OPTIONS
          respond @options 204

          log {
              output file /var/log/caddy/api.log
          }
      }

      http://api.kwaai.ai {
          reverse_proxy kwaainet-api:8000

          header {
              Access-Control-Allow-Origin \"*\"
              Access-Control-Allow-Methods \"GET, POST, PUT, DELETE, OPTIONS\"
              Access-Control-Allow-Headers \"Content-Type, Authorization\"
          }

          @options method OPTIONS
          respond @options 204
      }
      " > /etc/caddy/Caddyfile && caddy run --config /etc/caddy/Caddyfile'
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  docker_default:
    external: true

volumes:
  caddy_data:
    external: false
  caddy_config:
    external: false
  caddy_logs:
    external: false