services:
  kwaainet-node:
    image: kwaailab/kwaainet-node:latest
    container_name: kwaainet-node
    restart: unless-stopped
    environment:
      - PUBLIC_NAME=${USER:-kwaainet_user}
      - KWAAINET_BLOCKS=2
      # Enable MPS (Metal Performance Shaders) for Apple Silicon
      - PYTORCH_ENABLE_MPS_FALLBACK=1
      - CUDA_VISIBLE_DEVICES=""  # Disable CUDA detection
      # Force CPU mode initially - MPS will be detected by PyTorch
      - KWAAINET_DEVICE=auto
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache
    ports:
      - "8081:8080"
    # Remove NVIDIA device mappings for macOS
    # On macOS, GPU access is handled through Metal/MPS, not device files
    platform: linux/amd64  # Use amd64 image for compatibility

  kwaainet-api:
    image: kwaailab/kwaainet-api:latest
    container_name: kwaainet-api
    restart: unless-stopped
    environment:
      # Same MPS settings for API container
      - PYTORCH_ENABLE_MPS_FALLBACK=1
      - CUDA_VISIBLE_DEVICES=""
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache
    ports:
      - "8000:8000"
    platform: linux/amd64  # Use amd64 image for compatibility