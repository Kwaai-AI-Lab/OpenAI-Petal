version: "3.9"

services:
  kwaainet-node:
    image: ghcr.io/kwaai-ai-lab/kwaainet-node:latest
    container_name: kwaainet-node
    restart: unless-stopped
    environment:
    - PUBLIC_NAME=${PUBLIC_NAME:-anonymous_docker@kwaai}
    - PUBLIC_IP=${PUBLIC_IP:-}
    - KWAAINET_BLOCKS=${KWAAINET_BLOCKS:-4}
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache
    ports:
      - "8080:8080"

    # GPU access via CDI (Container Device Interface)
    # Modern approach - works with both rootful and rootless podman
    devices:
      - nvidia.com/gpu=all

    # For systems without CDI support, use legacy device mapping:
    # devices:
    #   - "/dev/nvidia0:/dev/nvidia0"
    #   - "/dev/nvidiactl:/dev/nvidiactl"
    #   - "/dev/nvidia-uvm:/dev/nvidia-uvm"

    # SELinux compatibility (RHEL/Fedora/CentOS)
    security_opt:
      - label=disable


  kwaainet-api:
    image: ghcr.io/kwaai-ai-lab/kwaainet-api:latest
    container_name: kwaainet-api
    restart: unless-stopped
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache
    ports:
      - "8000:8000"

    # SELinux compatibility (RHEL/Fedora/CentOS)
    security_opt:
      - label=disable

